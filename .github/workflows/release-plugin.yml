# Release one Animal Audio plugin (macOS or Windows). Version = plugins/<slug>/VERSION.
name: Release plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin
        type: choice
        required: true
        default: duck
        options: # plugin-slugs
          - duck
          - turtletime
      platform:
        description: Target OS
        type: choice
        options:
          - mac
          - win
        default: mac
      upload:
        description: Upload to Supabase after validation
        type: boolean
        default: true
      publish_github_release:
        description: Create/update GitHub Release (slug-vX.Y.Z)
        type: boolean
        default: true
  # Called by auto-release.yml for each plugin whose VERSION has no tag yet.
  workflow_call:
    inputs:
      plugin:
        type: string
        required: true
      platform:
        type: string
        required: true
      upload:
        type: boolean
        default: true
      publish_github_release:
        type: boolean
        default: true
      ref:
        description: Commit to release (defaults to the triggering commit)
        type: string
        default: ''

permissions:
  contents: write

env:
  AA_SUPABASE_PROJECT_REF: huivhdradgroykfvtclx

jobs:
  release-mac:
    if: inputs.platform == 'mac'
    runs-on: macos-14
    # Typical run ~10-15 min; notarization can be slow, but a signing hang should not burn 6 h.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Read plugin release metadata
        id: meta
        env:
          PLUGIN_INPUT: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          slug="$PLUGIN_INPUT"
          if [[ ! "$slug" =~ ^[a-z0-9]+$ ]]; then
            echo "Invalid plugin slug '$slug' (expected a lowercase folder name under plugins/)."
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          version=$(python3 scripts/read_plugin_version.py "$slug")
          tag=$(python3 scripts/read_plugin_version.py "$slug" --tag)
          product=$(python3 -c "import sys; sys.path.insert(0,'scripts'); from lib.plugin_release import get_plugin; print(get_plugin('$slug').product_name)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "product=$product" >> "$GITHUB_OUTPUT"

      - name: Checkout animal-audio-web
        if: ${{ inputs.upload }}
        uses: actions/checkout@v4
        with:
          repository: SammyEl-Sherif/animal-audio-web
          path: animal-audio-web
          token: ${{ secrets.AA_WEB_REPO_GITHUB_TOKEN != '' && secrets.AA_WEB_REPO_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Ninja
        run: brew install ninja

      - name: Import Developer ID certificates
        env:
          P12_BASE64: ${{ secrets.AA_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.AA_DEVELOPER_ID_P12_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.AA_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.AA_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ]; then
            echo "AA_DEVELOPER_ID_P12_BASE64 secret is required for signed releases."
            exit 1
          fi
          if [ -z "${INSTALLER_P12_BASE64:-}" ]; then
            echo "AA_DEVELOPER_ID_INSTALLER_P12_BASE64 secret is required to sign the .pkg (Developer ID Installer)."
            exit 1
          fi
          echo "$P12_BASE64" | base64 --decode > /tmp/devid.p12
          echo "$INSTALLER_P12_BASE64" | base64 --decode > /tmp/devid-installer.p12
          security create-keychain -p actions build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          # Notarization can take many minutes; keep the keychain unlocked for productsign afterwards.
          security set-keychain-settings -lut 21600 build.keychain
          # Both .p12 files carry the same private key; its ACL is fixed by the first import (the second one
          # finds the key already present), so every tool that signs with it must be trusted here. A tool
          # missing from the ACL hangs CI on an invisible keychain prompt.
          security import /tmp/devid.p12 -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild -T /usr/bin/security
          security import /tmp/devid-installer.p12 -k build.keychain -P "${INSTALLER_P12_PASSWORD:-$P12_PASSWORD}" \
            -T /usr/bin/productsign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm -f /tmp/devid.p12 /tmp/devid-installer.p12
          if ! security find-identity -v build.keychain | grep -q "Developer ID Installer:"; then
            echo "::error::Developer ID Installer identity not found after import."
            echo "Certificates in build.keychain:"
            security find-certificate -a build.keychain | grep '"labl"' || true
            echo "Identities (including invalid):"
            security find-identity build.keychain || true
            exit 1
          fi

      - name: Write notary API key
        env:
          P8_BASE64: ${{ secrets.AA_NOTARY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect
          echo "$P8_BASE64" | base64 --decode > ~/.appstoreconnect/AuthKey.p8
          cat >> ~/.appstoreconnect/notary.env <<EOF
          export AA_CODESIGN_IDENTITY="${{ secrets.AA_CODESIGN_IDENTITY }}"
          export AA_INSTALLER_CODESIGN_IDENTITY="${{ secrets.AA_INSTALLER_CODESIGN_IDENTITY }}"
          export AA_NOTARY_KEY="\$HOME/.appstoreconnect/AuthKey.p8"
          export AA_NOTARY_KEY_ID="${{ secrets.AA_NOTARY_KEY_ID }}"
          export AA_NOTARY_ISSUER="${{ secrets.AA_NOTARY_ISSUER }}"
          EOF

      - name: Release pipeline
        env:
          AA_WEB_REPO: ${{ github.workspace }}/animal-audio-web
          AA_SUPABASE_ACCESS_TOKEN: ${{ secrets.AA_SUPABASE_ACCESS_TOKEN }}
          AA_SUPABASE_DB_PASSWORD: ${{ secrets.AA_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          source ~/.appstoreconnect/notary.env
          upload_flag=--skip-upload
          if [ "${{ inputs.upload }}" = "true" ]; then upload_flag=--upload; fi
          ./scripts/release_plugin.sh '${{ steps.meta.outputs.slug }}' $upload_flag

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}-mac
          path: dist/releases/${{ steps.meta.outputs.slug }}/${{ steps.meta.outputs.version }}/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_github_release }}
        uses: ./.github/actions/publish-plugin-github-release
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.product }} ${{ steps.meta.outputs.version }}
          files: |
            dist/releases/${{ steps.meta.outputs.slug }}/${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.product }}-${{ steps.meta.outputs.version }}-mac-installer.pkg
            dist/releases/${{ steps.meta.outputs.slug }}/${{ steps.meta.outputs.version }}/manifest-mac.json

  release-win:
    if: inputs.platform == 'win'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Read plugin release metadata
        id: meta
        shell: bash
        env:
          PLUGIN_INPUT: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          slug="$PLUGIN_INPUT"
          if [[ ! "$slug" =~ ^[a-z0-9]+$ ]]; then
            echo "Invalid plugin slug '$slug' (expected a lowercase folder name under plugins/)."
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          version=$(python3 scripts/read_plugin_version.py "$slug")
          tag=$(python3 scripts/read_plugin_version.py "$slug" --tag)
          product=$(python3 -c "import sys; sys.path.insert(0,'scripts'); from lib.plugin_release import get_plugin; print(get_plugin('$slug').product_name)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "product=$product" >> "$GITHUB_OUTPUT"

      - name: Checkout animal-audio-web
        if: ${{ inputs.upload }}
        uses: actions/checkout@v4
        with:
          repository: SammyEl-Sherif/animal-audio-web
          path: animal-audio-web
          token: ${{ secrets.AA_WEB_REPO_GITHUB_TOKEN != '' && secrets.AA_WEB_REPO_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Release pipeline
        shell: pwsh
        env:
          AA_WEB_REPO: ${{ github.workspace }}/animal-audio-web
          AA_SUPABASE_ACCESS_TOKEN: ${{ secrets.AA_SUPABASE_ACCESS_TOKEN }}
          AA_SUPABASE_DB_PASSWORD: ${{ secrets.AA_SUPABASE_DB_PASSWORD }}
        run: |
          $upload = [bool]::Parse('${{ inputs.upload }}')
          if ($upload) {
            .\scripts\release_win_plugin.ps1 -Plugin '${{ steps.meta.outputs.slug }}' -Upload
          } else {
            .\scripts\release_win_plugin.ps1 -Plugin '${{ steps.meta.outputs.slug }}'
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}-win
          path: dist/releases/${{ steps.meta.outputs.slug }}/${{ steps.meta.outputs.version }}/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_github_release }}
        uses: ./.github/actions/publish-plugin-github-release
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.product }} ${{ steps.meta.outputs.version }}
          files: |
            dist/releases/${{ steps.meta.outputs.slug }}/${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.product }}-${{ steps.meta.outputs.version }}-win-vst3.zip
            dist/releases/${{ steps.meta.outputs.slug }}/${{ steps.meta.outputs.version }}/manifest-win.json
