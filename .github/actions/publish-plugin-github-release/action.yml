name: Publish plugin GitHub Release
description: Create/update the GitHub Release for an existing slug-vX.Y.Z tag and attach the release artifacts.

inputs:
  tag:
    description: Full tag (e.g. duck-v1.0.0)
    required: true
  name:
    description: Release title (e.g. Duck 1.0.0)
    required: true
  body:
    description: Release notes (markdown)
    required: false
    default: ''
  files:
    description: Newline-separated artifact paths
    required: true

runs:
  using: composite
  steps:
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ inputs.name }}
        body: ${{ inputs.body }}
        fail_on_unmatched_files: true
        files: ${{ inputs.files }}
